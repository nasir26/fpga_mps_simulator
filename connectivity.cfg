# connectivity.cfg — Vitis linker configuration for fpga_mps_simulator
#
# AXI master budget: EXACTLY 9
#   bank0_axi  .. bank7_axi  : 8 independent HBM tensor banks
#   gate_bundle              : shared port for gate_sequence + metadata
#
# HBM channel spread: 8 tensor banks mapped across 4 HBM pseudo-channels
# (2 banks per channel) to maximize concurrent read/write bandwidth.
# gate_bundle → HBM[16] (separate channel, no contention with tensor banks).
#
# Author: Nasir Ali
# Organization: C-DAC Noida
# Date: June 2026
# Target: Xilinx Alveo U55C, Vitis 2023.2

[connectivity]

# ── HBM tensor bank port assignments ─────────────────────────────────────────
# HBM[0]  and HBM[1]  share pseudo-channel 0  (banks 0 and 1)
# HBM[4]  and HBM[5]  share pseudo-channel 2  (banks 2 and 3)
# HBM[8]  and HBM[9]  share pseudo-channel 4  (banks 4 and 5)
# HBM[12] and HBM[13] share pseudo-channel 6  (banks 6 and 7)

sp=fpga_mps_simulator_1.bank0:HBM[0]
sp=fpga_mps_simulator_1.bank1:HBM[1]
sp=fpga_mps_simulator_1.bank2:HBM[4]
sp=fpga_mps_simulator_1.bank3:HBM[5]
sp=fpga_mps_simulator_1.bank4:HBM[8]
sp=fpga_mps_simulator_1.bank5:HBM[9]
sp=fpga_mps_simulator_1.bank6:HBM[12]
sp=fpga_mps_simulator_1.bank7:HBM[13]

# ── Gate/metadata bundle → dedicated HBM channel ─────────────────────────────
sp=fpga_mps_simulator_1.gate_seq:HBM[16]

[vivado]
# Vivado implementation strategy — proven U55C closure settings from v06
prop=run.impl_1.strategy=Congestion_SpreadLogic_high
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=1
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.MORE OPTIONS=-tns_cleanup
prop=run.synth_1.strategy=Flow_AreaOptimized_high
